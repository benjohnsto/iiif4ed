<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

<div class="container-fluid" style="margin-top:5em;">
<div class="row">
    <div class="two columns">


     {%- include menu.html -%}


      
    </div>
    <div class="ten columns">

      <h2>{{ page.title }}</h2>
      
      {% if page.callout != "" %}
      <p class='callout'>
        <a href="#"  onclick="copyDivContent()" title="copy Lesson HTML"><img src="{{ site.baseurl }}/assets/images/copy.svg" style="float:right;" alt="click to copy lesson html"/></a>
        {{ page.callout }}
      </p>
      {% endif %}      
      <p style="text-align:right;padding:1em 20% 0 7%;margin:0;"><button onclick="copyDivContent()" class="button">Copy Lesson HTML</button></p>
    
      <div class="activity" id="activity">
     
      {{ content }}  
      
      </div>

    </div>
</div>
</div>


    {%- include footer.html -%}

  </body>

</html>
