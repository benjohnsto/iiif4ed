
{% assign sorted_pages = site.pages | sort: 'title' %}
<ul class='activity_list'>
  {% for item in sorted_pages %}
    {% if item.category contains include.category %}
      <li>
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% if item.description %}
          <p>{{ item.description }}</p>
        {% endif %}
      </li>
    {% endif %}
  {% endfor %}
</ul>
